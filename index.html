<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adiós mi niña</title>
  <style>
    :root{
      --bg1:#06090f;
      --bg2:#0d1522;
      --text:#f4f1ea;
      --soft:#c9b8a6;
      --stem:#4d7c59;
      --leaf:#5b9b6b;
      --petal1:#b84b5e;
      --petal2:#d86c7d;
      --petal3:#e79aaa;
      --center:#d8b36a;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:"Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top, #182235 0%, var(--bg2) 35%, var(--bg1) 100%);
      color:var(--text);
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    .bg-particles{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .particle{
      position:absolute;
      width:2px;
      height:2px;
      border-radius:50%;
      background:rgba(255,255,255,.35);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp{
      from{
        transform:translateY(0px);
        opacity:0;
      }
      20%{ opacity:.55; }
      80%{ opacity:.25; }
      to{
        transform:translateY(-110vh);
        opacity:0;
      }
    }

    .container{
      position:relative;
      z-index:2;
      width:min(92vw, 520px);
      padding:34px 24px 44px;
      border-radius:30px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      box-shadow:0 18px 55px rgba(0,0,0,.35);
      text-align:center;
    }

    h1{
      font-size:clamp(2rem, 7vw, 3.4rem);
      font-weight:600;
      letter-spacing:.04em;
      margin-bottom:10px;
    }

    .subtitle{
      color:var(--soft);
      font-size:clamp(.95rem, 3.5vw, 1.08rem);
      margin-bottom:26px;
    }

    .scene{
      position:relative;
      width:100%;
      height:420px;
      display:flex;
      justify-content:center;
      align-items:flex-end;
      overflow:hidden;
    }

    .flower{
      position:relative;
      width:180px;
      height:340px;
    }

    .stem{
      position:absolute;
      left:50%;
      bottom:42px;
      width:8px;
      height:180px;
      transform:translateX(-50%);
      background:linear-gradient(to bottom, #77a67e, var(--stem));
      border-radius:10px;
      box-shadow:0 0 8px rgba(111, 193, 111, .12);
    }

    .leaf{
      position:absolute;
      bottom:140px;
      width:55px;
      height:26px;
      background:linear-gradient(135deg, #76bc87, var(--leaf));
      border-radius:55px 0 55px 0;
      opacity:.95;
    }

    .leaf.left{
      left:38px;
      transform:rotate(-25deg);
    }

    .leaf.right{
      right:38px;
      transform:scaleX(-1) rotate(-25deg);
    }

    .head{
      position:absolute;
      left:50%;
      top:58px;
      width:130px;
      height:130px;
      transform:translateX(-50%);
    }

    .center{
      position:absolute;
      left:50%;
      top:50%;
      width:38px;
      height:38px;
      transform:translate(-50%, -50%);
      border-radius:50%;
      background:radial-gradient(circle, #efd99c 0%, var(--center) 65%, #9f7d43 100%);
      z-index:5;
      box-shadow:0 0 12px rgba(216,179,106,.25);
    }

    .petal{
      position:absolute;
      left:50%;
      top:50%;
      width:44px;
      height:62px;
      margin-left:-22px;
      margin-top:-31px;
      transform-origin:50% 85%;
      border-radius:55% 55% 48% 48%;
      background:linear-gradient(180deg, var(--petal3), var(--petal2) 45%, var(--petal1));
      box-shadow:inset 0 0 10px rgba(255,255,255,.08),
                 0 4px 10px rgba(0,0,0,.16);
    }

    .p1{ transform:rotate(0deg) translateY(-44px); animation:fall1 8s ease-in-out infinite; }
    .p2{ transform:rotate(45deg) translateY(-44px); animation:fall2 9s ease-in-out infinite; }
    .p3{ transform:rotate(90deg) translateY(-44px); animation:fall3 10s ease-in-out infinite; }
    .p4{ transform:rotate(135deg) translateY(-44px); animation:fall4 11s ease-in-out infinite; }
    .p5{ transform:rotate(180deg) translateY(-44px); animation:fall5 12s ease-in-out infinite; }
    .p6{ transform:rotate(225deg) translateY(-44px); animation:fall6 13s ease-in-out infinite; }
    .p7{ transform:rotate(270deg) translateY(-44px); animation:fall7 14s ease-in-out infinite; }
    .p8{ transform:rotate(315deg) translateY(-44px); animation:fall8 15s ease-in-out infinite; }

    @keyframes fall1{
      0%,15%{ opacity:1; transform:rotate(0deg) translateY(-44px) translateX(0); }
      28%,100%{ opacity:0; transform:rotate(120deg) translate(120px, 240px); }
    }
    @keyframes fall2{
      0%,22%{ opacity:1; transform:rotate(45deg) translateY(-44px) translateX(0); }
      35%,100%{ opacity:0; transform:rotate(150deg) translate(90px, 250px); }
    }
    @keyframes fall3{
      0%,30%{ opacity:1; transform:rotate(90deg) translateY(-44px) translateX(0); }
      43%,100%{ opacity:0; transform:rotate(180deg) translate(50px, 270px); }
    }
    @keyframes fall4{
      0%,38%{ opacity:1; transform:rotate(135deg) translateY(-44px) translateX(0); }
      50%,100%{ opacity:0; transform:rotate(205deg) translate(-10px, 280px); }
    }
    @keyframes fall5{
      0%,46%{ opacity:1; transform:rotate(180deg) translateY(-44px) translateX(0); }
      58%,100%{ opacity:0; transform:rotate(230deg) translate(-55px, 270px); }
    }
    @keyframes fall6{
      0%,54%{ opacity:1; transform:rotate(225deg) translateY(-44px) translateX(0); }
      66%,100%{ opacity:0; transform:rotate(260deg) translate(-90px, 250px); }
    }
    @keyframes fall7{
      0%,62%{ opacity:1; transform:rotate(270deg) translateY(-44px) translateX(0); }
      74%,100%{ opacity:0; transform:rotate(300deg) translate(-120px, 235px); }
    }
    @keyframes fall8{
      0%,70%{ opacity:1; transform:rotate(315deg) translateY(-44px) translateX(0); }
      82%,100%{ opacity:0; transform:rotate(340deg) translate(-70px, 240px); }
    }

    .fallen-petals{
      position:absolute;
      bottom:18px;
      left:50%;
      width:220px;
      height:70px;
      transform:translateX(-50%);
      pointer-events:none;
    }

    .ground-petal{
      position:absolute;
      width:24px;
      height:34px;
      border-radius:55% 55% 48% 48%;
      background:linear-gradient(180deg, var(--petal3), var(--petal1));
      opacity:.55;
      filter:blur(.2px);
    }

    .g1{ left:18px; bottom:10px; transform:rotate(-35deg); }
    .g2{ left:58px; bottom:2px; transform:rotate(20deg); }
    .g3{ left:98px; bottom:12px; transform:rotate(-8deg); }
    .g4{ right:46px; bottom:4px; transform:rotate(38deg); }
    .g5{ right:14px; bottom:14px; transform:rotate(-22deg); }

    .line{
      margin:8px auto 0;
      width:70px;
      height:2px;
      border-radius:10px;
      background:linear-gradient(to right, transparent, rgba(255,255,255,.6), transparent);
      opacity:.7;
    }

    .footer{
      margin-top:14px;
      color:rgba(255,255,255,.62);
      font-size:.92rem;
      letter-spacing:.03em;
    }

    @media (max-width:480px){
      .container{
        padding:28px 18px 36px;
      }

      .scene{
        height:380px;
      }

      .flower{
        transform:scale(.92);
      }
    }
  </style>
</head>
<body>
  <div class="bg-particles" id="bgParticles"></div>

  <main class="container">
    <h1>Adiós mi niña</h1>
    <p class="subtitle">cuidate mucho, te recordare siempre...</p>

    <div class="line"></div>

    <section class="scene">
      <div class="flower">
        <div class="stem"></div>
        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="head">
          <div class="petal p1"></div>
          <div class="petal p2"></div>
          <div class="petal p3"></div>
          <div class="petal p4"></div>
          <div class="petal p5"></div>
          <div class="petal p6"></div>
          <div class="petal p7"></div>
          <div class="petal p8"></div>
          <div class="center"></div>
        </div>

        <div class="fallen-petals">
          <div class="ground-petal g1"></div>
          <div class="ground-petal g2"></div>
          <div class="ground-petal g3"></div>
          <div class="ground-petal g4"></div>
          <div class="ground-petal g5"></div>
        </div>
      </div>
    </section>

    <div class="footer">A veces querer también es dejar ir.</div>
  </main>

  <script>
    const bg = document.getElementById('bgParticles');

    function createParticle(){
      const p = document.createElement('span');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = (100 + Math.random() * 20) + 'vh';
      p.style.opacity = Math.random() * 0.55;
      p.style.animationDuration = (12 + Math.random() * 16) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      bg.appendChild(p);
    }

    for(let i = 0; i < 34; i++){
      createParticle();
    }
  </script>
</body>
</html>
