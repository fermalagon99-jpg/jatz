<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adiós mi niña</title>
  <style>
    :root{
      --bg1:#05070c;
      --bg2:#0d1420;
      --text:#f5f1ea;
      --soft:#c8b8ab;
      --stem:#4f7d5c;
      --stem-dark:#35553f;
      --leaf:#5c9669;
      --rose1:#7f1830;
      --rose2:#a62645;
      --rose3:#c94868;
      --rose4:#e48ca2;
      --petal:#c44a68;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      font-family:"Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at top, #172236 0%, var(--bg2) 40%, var(--bg1) 100%);
      color:var(--text);
    }

    body{
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    .particles{
      position:fixed;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      z-index:0;
    }

    .particle{
      position:absolute;
      width:2px;
      height:2px;
      border-radius:50%;
      background:rgba(255,255,255,.35);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp{
      from{
        transform:translateY(0);
        opacity:0;
      }
      20%{ opacity:.55; }
      80%{ opacity:.2; }
      to{
        transform:translateY(-110vh);
        opacity:0;
      }
    }

    .container{
      position:relative;
      z-index:2;
      width:min(92vw, 560px);
      padding:34px 24px 42px;
      border-radius:30px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      box-shadow:0 20px 60px rgba(0,0,0,.35);
      text-align:center;
    }

    h1{
      font-size:clamp(2rem, 7vw, 3.5rem);
      font-weight:600;
      letter-spacing:.03em;
      margin-bottom:10px;
    }

    .subtitle{
      color:var(--soft);
      font-size:clamp(.95rem, 3.5vw, 1.08rem);
      margin-bottom:18px;
    }

    .line{
      width:80px;
      height:2px;
      margin:0 auto 24px;
      background:linear-gradient(to right, transparent, rgba(255,255,255,.7), transparent);
      border-radius:999px;
      opacity:.8;
    }

    .scene{
      position:relative;
      width:100%;
      height:420px;
      display:flex;
      justify-content:center;
      align-items:flex-end;
      overflow:hidden;
    }

    .rose-wrap{
      position:relative;
      width:260px;
      height:360px;
    }

    .rose-svg{
      width:100%;
      height:100%;
      overflow:visible;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.25));
    }

    .petal-fall{
      position:absolute;
      width:24px;
      height:34px;
      background:linear-gradient(180deg, #e197ab, var(--petal));
      border-radius:60% 60% 55% 55%;
      box-shadow:0 4px 10px rgba(0,0,0,.15);
      opacity:0;
    }

    .pf1{
      left:132px;
      top:120px;
      animation: fall1 8s ease-in-out infinite;
    }

    .pf2{
      left:146px;
      top:145px;
      animation: fall2 10s ease-in-out infinite;
    }

    .pf3{
      left:156px;
      top:168px;
      animation: fall3 12s ease-in-out infinite;
    }

    @keyframes fall1{
      0%,20%{
        transform:translate(0,0) rotate(0deg);
        opacity:0;
      }
      24%{
        opacity:1;
      }
      60%{
        transform:translate(-60px,160px) rotate(130deg);
        opacity:.85;
      }
      100%{
        transform:translate(-110px,220px) rotate(220deg);
        opacity:0;
      }
    }

    @keyframes fall2{
      0%,35%{
        transform:translate(0,0) rotate(0deg);
        opacity:0;
      }
      39%{
        opacity:1;
      }
      72%{
        transform:translate(30px,170px) rotate(160deg);
        opacity:.85;
      }
      100%{
        transform:translate(70px,220px) rotate(260deg);
        opacity:0;
      }
    }

    @keyframes fall3{
      0%,52%{
        transform:translate(0,0) rotate(0deg);
        opacity:0;
      }
      56%{
        opacity:1;
      }
      80%{
        transform:translate(-20px,150px) rotate(120deg);
        opacity:.8;
      }
      100%{
        transform:translate(-45px,210px) rotate(220deg);
        opacity:0;
      }
    }

    .ground{
      position:absolute;
      bottom:18px;
      left:50%;
      transform:translateX(-50%);
      width:240px;
      height:60px;
      pointer-events:none;
    }

    .ground-petal{
      position:absolute;
      width:24px;
      height:34px;
      border-radius:60% 60% 55% 55%;
      background:linear-gradient(180deg, #db8fa4, #b53958);
      opacity:.55;
      filter:blur(.15px);
    }

    .g1{ left:26px; bottom:10px; transform:rotate(-25deg); }
    .g2{ left:78px; bottom:4px; transform:rotate(15deg); }
    .g3{ left:116px; bottom:16px; transform:rotate(-12deg); }
    .g4{ right:52px; bottom:6px; transform:rotate(30deg); }
    .g5{ right:20px; bottom:14px; transform:rotate(-18deg); }

    .footer{
      margin-top:8px;
      color:rgba(255,255,255,.62);
      font-size:.94rem;
      letter-spacing:.03em;
    }

    @media (max-width:480px){
      .container{
        padding:28px 18px 36px;
      }

      .scene{
        height:390px;
      }

      .rose-wrap{
        transform:scale(.92);
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <main class="container">
    <h1>Adiós mi niña</h1>
    <p class="subtitle">Cuida te mucho, te recordare siempre, gracias por acelerarme el corazon.</p>
    <div class="line"></div>

    <section class="scene">
      <div class="rose-wrap">
        <svg class="rose-svg" viewBox="0 0 260 360" xmlns="http://www.w3.org/2000/svg" aria-label="Rosa agachada">
          <!-- tallo -->
          <path d="M130 320
                   C128 290, 124 250, 130 220
                   C137 185, 170 170, 190 145"
                fill="none"
                stroke="url(#stemGrad)"
                stroke-width="8"
                stroke-linecap="round"/>

          <!-- hojas -->
          <path d="M128 235
                   C100 214, 78 216, 63 238
                   C87 245, 108 246, 128 235Z"
                fill="url(#leafGrad)"/>

          <path d="M138 210
                   C163 194, 186 192, 205 206
                   C181 220, 158 221, 138 210Z"
                fill="url(#leafGrad)"/>

          <!-- botón / base rosa -->
          <g transform="translate(188 132) rotate(62)">
            <!-- sépalos -->
            <path d="M-12 18 C-18 10,-18 4,-8 0 C-2 6,-1 13,-12 18Z" fill="#507e59"/>
            <path d="M0 20 C-4 10,-3 1,7 -1 C10 7,8 15,0 20Z" fill="#5b8d64"/>
            <path d="M12 17 C9 8,10 1,18 -2 C21 7,19 13,12 17Z" fill="#4f7c58"/>

            <!-- pétalos externos -->
            <ellipse cx="-18" cy="-10" rx="15" ry="26" fill="var(--rose2)" transform="rotate(-30)"/>
            <ellipse cx="18" cy="-12" rx="15" ry="27" fill="var(--rose2)" transform="rotate(28)"/>
            <ellipse cx="0" cy="-20" rx="19" ry="30" fill="var(--rose3)"/>

            <!-- pétalos medios -->
            <ellipse cx="-8" cy="-12" rx="12" ry="22" fill="var(--rose4)" transform="rotate(-20)"/>
            <ellipse cx="10" cy="-13" rx="12" ry="21" fill="var(--rose3)" transform="rotate(18)"/>

            <!-- centro -->
            <path d="M-2 -18
                     C-8 -10,-7 -1,0 4
                     C7 -1,7 -10,2 -18
                     C1 -21,-1 -21,-2 -18Z"
                  fill="var(--rose1)"/>

            <path d="M-5 -3
                     C-2 -7,4 -8,8 -2
                     C5 4,-1 5,-5 -3Z"
                  fill="var(--rose2)"/>
          </g>

          <defs>
            <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#739b7d"/>
              <stop offset="100%" stop-color="#33513c"/>
            </linearGradient>

            <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#79b486"/>
              <stop offset="100%" stop-color="#4e7b59"/>
            </linearGradient>
          </defs>
        </svg>

        <div class="petal-fall pf1"></div>
        <div class="petal-fall pf2"></div>
        <div class="petal-fall pf3"></div>

        <div class="ground">
          <div class="ground-petal g1"></div>
          <div class="ground-petal g2"></div>
          <div class="ground-petal g3"></div>
          <div class="ground-petal g4"></div>
          <div class="ground-petal g5"></div>
        </div>
      </div>
    </section>

    <div class="footer">A veces el amor también se despide en silencio.</div>
  </main>

  <script>
    const particles = document.getElementById('particles');

    function createParticle(){
      const p = document.createElement('span');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = (100 + Math.random() * 20) + 'vh';
      p.style.animationDuration = (12 + Math.random() * 16) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      p.style.opacity = Math.random() * 0.55;
      particles.appendChild(p);
    }

    for(let i = 0; i < 36; i++){
      createParticle();
    }
  </script>
</body>
</html>
