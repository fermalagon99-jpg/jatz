<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#04070d" />
  <title>Flores Amarillas 💛</title>
  <style>
    :root{
      --bg:#04070d;
      --bg2:#08111f;
      --cream:#f6e3b0;
      --cream-dark:#e8d39a;
      --code:#031a2e;
      --code-2:#082541;
      --white:#f6f8fc;
      --yellow:#ffd95a;
      --yellow2:#ffca2a;
      --yellow3:#f2b500;
      --green:#6fc16f;
      --green2:#4ca957;
      --red:#ff5a5a;
      --shadow:rgba(0,0,0,.28);
    }

    *{ box-sizing:border-box; }

    html,body{
      width:100%;
      height:100%;
      margin:0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #0b1529 0%, var(--bg) 55%);
      color:var(--white);
      overflow-x:hidden;
    }

    body{
      display:flex;
      justify-content:center;
      padding:18px 14px 40px;
      position:relative;
    }

    .bg-code{
      position:fixed;
      inset:0;
      overflow:hidden;
      z-index:0;
      pointer-events:none;
      opacity:.24;
      filter: blur(.3px);
    }

    .code-line{
      position:absolute;
      left:0;
      width:140%;
      color:#d8ecff;
      font-family: Consolas, monospace;
      font-size:clamp(16px, 2.6vw, 28px);
      white-space:nowrap;
      animation: drift linear infinite;
      text-shadow: 0 0 10px rgba(255,255,255,.05);
    }

    .code-line.red { color:#ff5d5d; opacity:.24; }
    .code-line.cyan { color:#68dbff; opacity:.22; }
    .code-line.white { color:#f4f7fb; opacity:.18; }

    @keyframes drift{
      from{ transform:translateX(-8%); }
      to{ transform:translateX(-32%); }
    }

    .spark{
      position:fixed;
      width:7px;
      height:7px;
      border-radius:50%;
      background: radial-gradient(circle, #fff8bf 0 35%, #ffd54d 36% 70%, rgba(255,213,77,0) 71%);
      box-shadow:0 0 12px rgba(255,217,90,.85), 0 0 24px rgba(255,217,90,.35);
      animation: twinkle ease-in-out infinite alternate;
      z-index:1;
      pointer-events:none;
    }

    @keyframes twinkle{
      from{ opacity:.15; transform:scale(.6); }
      to{ opacity:1; transform:scale(1.55); }
    }

    .page{
      position:relative;
      width:min(100%, 420px);
      z-index:2;
    }

    .brand{
      text-align:center;
      margin-top:8px;
      margin-bottom:16px;
    }

    .brand-logo{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:74px;
      height:74px;
      border-radius:22px;
      margin-bottom:2px;
      background:linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 14px 34px rgba(0,0,0,.25);
      font-size:44px;
      font-weight:800;
      letter-spacing:.04em;
    }

    .brand-name{
      font-weight:700;
      letter-spacing:.16em;
      font-size:18px;
      margin-top:2px;
    }

    .tabs{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      margin:8px 6px 20px;
    }

    .tab{
      flex:1;
      text-align:center;
      padding:10px 0;
      font-size:clamp(16px, 5vw, 20px);
      font-family: Consolas, monospace;
      letter-spacing:.05em;
      border-radius:16px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 8px 18px rgba(0,0,0,.18);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .hero-card{
      position:relative;
      background:var(--cream);
      border-radius:34px;
      min-height:360px;
      padding:22px 20px 18px;
      box-shadow:
        0 20px 45px rgba(0,0,0,.26),
        inset 0 1px 0 rgba(255,255,255,.25);
      overflow:hidden;
    }

    .hero-card::before{
      content:"";
      position:absolute;
      inset:auto -40px -30px auto;
      width:140px;
      height:140px;
      border-radius:50%;
      background:rgba(255,255,255,.13);
      filter:blur(2px);
    }

    .love{
      text-align:center;
      color:#22160f;
      font-size:22px;
      font-family:"Trebuchet MS", "Comic Sans MS", cursive, sans-serif;
      margin-bottom:10px;
    }

    .love span{
      display:inline-block;
      transform:translateY(1px);
    }

    .illustration{
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:270px;
      position:relative;
    }

    .illustration svg{
      width:min(88%, 280px);
      height:auto;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,.16));
    }

    .sparkle-dot{
      position:absolute;
      width:16px;
      height:16px;
      background: radial-gradient(circle, #fff8c2 0 35%, #ffd969 36% 70%, rgba(255,217,105,0) 71%);
      box-shadow:0 0 12px rgba(255,216,90,.6);
      border-radius:50%;
      animation: cardSpark 1.8s ease-in-out infinite alternate;
    }

    .sparkle-dot.s1{ left:18%; top:44%; animation-delay:.2s; }
    .sparkle-dot.s2{ right:18%; top:36%; animation-delay:.8s; }
    .sparkle-dot.s3{ right:24%; bottom:20%; animation-delay:1.3s; }
    .sparkle-dot.s4{ left:22%; bottom:24%; animation-delay:.5s; }

    @keyframes cardSpark{
      from{ opacity:.2; transform:scale(.7) translateY(0); }
      to{ opacity:1; transform:scale(1.25) translateY(-6px); }
    }

    .code-box{
      margin:22px auto 0;
      background:linear-gradient(180deg, var(--code-2), var(--code));
      border-radius:30px;
      padding:16px 16px 18px;
      box-shadow:0 18px 38px rgba(0,0,0,.32);
      border:1px solid rgba(255,255,255,.06);
      overflow:hidden;
    }

    .code-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:12px;
      gap:10px;
      color:#d9ecff;
      font-family:Consolas, monospace;
      font-size:15px;
    }

    .dots{
      display:flex;
      gap:8px;
      align-items:center;
    }

    .dot{
      width:14px;
      height:14px;
      border-radius:50%;
      box-shadow:0 0 8px rgba(255,255,255,.12);
    }

    .dot.red{ background:#ff5b5b; }
    .dot.yellow{ background:#ffd54c; }
    .dot.green{ background:#79d66a; }

    pre{
      margin:0;
      overflow:auto;
      color:#edf5ff;
      font-family:Consolas, monospace;
      font-size:clamp(15px, 4vw, 17px);
      line-height:1.7;
    }

    .line-no{
      color:#6e86a5;
      display:inline-block;
      width:24px;
      user-select:none;
    }

    .sel{ color:#f6d45c; }
    .prop{ color:#f4f7fb; }
    .valr{ color:#ff826d; }
    .valg{ color:#86de7b; }
    .valy{ color:#ffca58; }
    .tag{ color:#97c9ff; }

    .footer-note{
      text-align:center;
      margin-top:16px;
      color:rgba(255,255,255,.68);
      font-size:13px;
    }

    @media (max-width:430px){
      .hero-card{ min-height:340px; border-radius:28px; }
      .code-box{ border-radius:24px; }
      .brand-logo{ width:66px; height:66px; font-size:38px; }
      .love{ font-size:20px; }
      pre{ font-size:15px; }
    }
  </style>
</head>
<body>
  <div class="bg-code" aria-hidden="true" id="bgCode"></div>
  <div id="sparkLayer" aria-hidden="true"></div>

  <main class="page">
    <div class="brand">
      <div class="brand-logo">A</div>
      <div class="brand-name">DEV</div>
    </div>

    <section class="tabs" aria-label="tecnologías">
      <div class="tab">Html</div>
      <div class="tab">Css</div>
      <div class="tab">Js</div>
    </section>

    <section class="hero-card">
      <div class="love">I Love You <span>❤️</span></div>

      <div class="illustration">
        <span class="sparkle-dot s1"></span>
        <span class="sparkle-dot s2"></span>
        <span class="sparkle-dot s3"></span>
        <span class="sparkle-dot s4"></span>

        <svg viewBox="0 0 260 260" role="img" aria-label="Conejito sosteniendo flores amarillas">
          <!-- shadow -->
          <ellipse cx="130" cy="220" rx="48" ry="12" fill="rgba(100,80,50,.18)"/>

          <!-- ears -->
          <ellipse cx="106" cy="54" rx="17" ry="34" fill="#efeff6" stroke="#655e66" stroke-width="2.2"/>
          <ellipse cx="154" cy="54" rx="17" ry="34" fill="#efeff6" stroke="#655e66" stroke-width="2.2"/>
          <ellipse cx="106" cy="57" rx="7" ry="19" fill="#f3d7dc"/>
          <ellipse cx="154" cy="57" rx="7" ry="19" fill="#f3d7dc"/>

          <!-- body -->
          <rect x="92" y="76" width="76" height="114" rx="30" fill="#f0f1f6" stroke="#655e66" stroke-width="2.2"/>
          <ellipse cx="130" cy="98" rx="24" ry="17" fill="#f0f1f6"/>
          <ellipse cx="118" cy="92" rx="3" ry="4" fill="#463f45"/>
          <ellipse cx="142" cy="92" rx="3" ry="4" fill="#463f45"/>
          <ellipse cx="130" cy="101" rx="5" ry="4" fill="#f3a6ac"/>
          <path d="M123 109 Q130 115 137 109" fill="none" stroke="#544c52" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="111" cy="102" r="4" fill="#f5c1c7" opacity=".75"/>
          <circle cx="149" cy="102" r="4" fill="#f5c1c7" opacity=".75"/>

          <!-- feet -->
          <ellipse cx="112" cy="194" rx="13" ry="22" fill="#efeff6" stroke="#655e66" stroke-width="2.2"/>
          <ellipse cx="148" cy="194" rx="13" ry="22" fill="#efeff6" stroke="#655e66" stroke-width="2.2"/>

          <!-- bouquet stems -->
          <g opacity=".95">
            <path d="M126 176 L98 120" stroke="#5aae56" stroke-width="5" stroke-linecap="round"/>
            <path d="M132 176 L114 118" stroke="#6abf63" stroke-width="5" stroke-linecap="round"/>
            <path d="M136 176 L128 114" stroke="#5aae56" stroke-width="5" stroke-linecap="round"/>
            <path d="M140 176 L147 115" stroke="#6abf63" stroke-width="5" stroke-linecap="round"/>
            <path d="M145 176 L164 122" stroke="#5aae56" stroke-width="5" stroke-linecap="round"/>
          </g>

          <!-- paws -->
          <ellipse cx="101" cy="140" rx="11" ry="16" fill="#efeff6" stroke="#655e66" stroke-width="2.2" transform="rotate(-18 101 140)"/>
          <ellipse cx="158" cy="140" rx="11" ry="16" fill="#efeff6" stroke="#655e66" stroke-width="2.2" transform="rotate(18 158 140)"/>

          <!-- flowers -->
          <g>
            <!-- flower helper shapes -->
            <g transform="translate(82 112)">
              <circle r="10" fill="#f3a13b"/>
              <g fill="#ffd95a" stroke="#8a6b18" stroke-width="2">
                <circle cx="0" cy="-17" r="11"/>
                <circle cx="16" cy="-6" r="11"/>
                <circle cx="10" cy="13" r="11"/>
                <circle cx="-10" cy="13" r="11"/>
                <circle cx="-16" cy="-5" r="11"/>
              </g>
            </g>

            <g transform="translate(107 100)">
              <circle r="10" fill="#f3a13b"/>
              <g fill="#ffe067" stroke="#8a6b18" stroke-width="2">
                <circle cx="0" cy="-18" r="12"/>
                <circle cx="17" cy="-7" r="12"/>
                <circle cx="10" cy="14" r="12"/>
                <circle cx="-10" cy="14" r="12"/>
                <circle cx="-17" cy="-6" r="12"/>
              </g>
            </g>

            <g transform="translate(132 115)">
              <circle r="10" fill="#f3a13b"/>
              <g fill="#ffd85a" stroke="#8a6b18" stroke-width="2">
                <circle cx="0" cy="-17" r="11"/>
                <circle cx="16" cy="-6" r="11"/>
                <circle cx="10" cy="13" r="11"/>
                <circle cx="-10" cy="13" r="11"/>
                <circle cx="-16" cy="-5" r="11"/>
              </g>
            </g>

            <g transform="translate(156 101)">
              <circle r="10" fill="#f3a13b"/>
              <g fill="#ffe067" stroke="#8a6b18" stroke-width="2">
                <circle cx="0" cy="-18" r="12"/>
                <circle cx="17" cy="-7" r="12"/>
                <circle cx="10" cy="14" r="12"/>
                <circle cx="-10" cy="14" r="12"/>
                <circle cx="-17" cy="-6" r="12"/>
              </g>
            </g>

            <g transform="translate(178 114)">
              <circle r="9" fill="#f3a13b"/>
              <g fill="#ffd658" stroke="#8a6b18" stroke-width="2">
                <circle cx="0" cy="-15" r="10"/>
                <circle cx="14" cy="-5" r="10"/>
                <circle cx="8" cy="11" r="10"/>
                <circle cx="-8" cy="11" r="10"/>
                <circle cx="-14" cy="-5" r="10"/>
              </g>
            </g>

            <g transform="translate(145 86) scale(.6)">
              <circle r="8" fill="#f3a13b"/>
              <g fill="#ffd658" stroke="#8a6b18" stroke-width="2">
                <circle cx="0" cy="-13" r="8"/>
                <circle cx="12" cy="-4" r="8"/>
                <circle cx="8" cy="10" r="8"/>
                <circle cx="-8" cy="10" r="8"/>
                <circle cx="-12" cy="-4" r="8"/>
              </g>
            </g>
          </g>
        </svg>
      </div>
    </section>

    <section class="code-box">
      <div class="code-top">
        <div class="dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div>Style.css</div>
      </div>

      <pre><span class="line-no">1</span><span class="sel">.Flowers__Love</span> {
<span class="line-no">2</span>  <span class="prop">background-color</span>: <span class="valr">#fae2bf</span>;
<span class="line-no">3</span>  <span class="prop">color</span>: <span class="valr">#000</span>;
<span class="line-no">4</span>  <span class="prop">border</span>: <span class="valr">none</span>;
<span class="line-no">5</span>  <span class="prop">padding</span>: <span class="valy">12px 20px</span>;
<span class="line-no">6</span>  <span class="prop">font-size</span>: <span class="valy">18px</span>;
<span class="line-no">7</span>  <span class="prop">font-family</span>: <span class="valg">'Flower'</span>;
<span class="line-no">8</span>  <span class="prop">border-radius</span>: <span class="valy">10px</span>;
<span class="line-no">9</span>}</pre>
    </section>

    <div class="footer-note">Hecho con Html, Css y un toque bonito ✨</div>
  </main>

  <script>
    const bg = document.getElementById('bgCode');
    const sparkLayer = document.getElementById('sparkLayer');

    const snippets = [
      "const flowers = ['yellow', 'love', 'smile'];",
      ".container { display:flex; justify-content:center; }",
      "document.querySelector('.love').classList.add('active');",
      "function smile(){ return 'sonríe jath 💛'; }",
      "background: linear-gradient(180deg, #04101f, #0a203d);",
      "<div class='flowers'>I Love You ❤️</div>",
      "if (love === true) { sendFlowers(); }",
      "border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,.2);",
      "const bunny = { cute:true, flowers:'yellow' };",
      ".spark { animation: twinkle 2s infinite alternate; }",
      "let message = 'Flores Amarillas para ti';",
      "window.addEventListener('load', () => bloom());"
    ];

    function makeCodeLine(text, top, duration, cls){
      const el = document.createElement('div');
      el.className = `code-line ${cls}`;
      el.style.top = top + '%';
      el.style.animationDuration = duration + 's';
      el.textContent = text;
      bg.appendChild(el);
    }

    for(let i=0;i<18;i++){
      const text = snippets[i % snippets.length];
      const top = 3 + i * 5.4;
      const duration = 18 + Math.random() * 18;
      const cls = i % 3 === 0 ? 'red' : i % 3 === 1 ? 'cyan' : 'white';
      makeCodeLine(text, top, duration, cls);
    }

    function addSparkles(){
      const total = window.innerWidth < 500 ? 18 : 26;
      for(let i=0;i<total;i++){
        const s = document.createElement('span');
        s.className = 'spark';
        s.style.left = (Math.random() * 100) + 'vw';
        s.style.top = (Math.random() * 100) + 'vh';
        s.style.animationDuration = (1.3 + Math.random() * 2.6) + 's';
        s.style.animationDelay = (Math.random() * 2) + 's';
        sparkLayer.appendChild(s);
      }
    }

    addSparkles();
  </script>
</body>
</html>
