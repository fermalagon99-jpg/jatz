<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050817" />
  <title>Sonríe Jath</title>
  <style>
    :root{
      --bg-1:#030511;
      --bg-2:#071126;
      --gold:#ffe9a8;
      --leaf:#17a260;
      --leaf-dark:#087044;
      --white:#fffafc;
    }

    *{ box-sizing:border-box; }

    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:var(--bg-1);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body{
      color:var(--white);
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }

    .scene{
      position:relative;
      width:100%;
      height:100%;
      min-height:520px;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(circle at 50% 72%, rgba(28,65,91,.38), transparent 35%),
        radial-gradient(circle at 20% 20%, rgba(43,18,64,.24), transparent 28%),
        linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 64%, #02040d 100%);
    }

    .scene::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-2;
      opacity:.5;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.85) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255,230,142,.65) 0 1px, transparent 1.7px);
      background-size: 92px 92px, 137px 137px;
      background-position: 17px 31px, 63px 18px;
      animation: starsDrift 24s linear infinite;
    }

    .scene::after{
      content:"";
      position:absolute;
      left:50%;
      bottom:-15vh;
      width:110vw;
      height:42vh;
      transform:translateX(-50%);
      z-index:-1;
      background:radial-gradient(ellipse at center, rgba(1,10,21,.5), #000 68%);
      filter:blur(1px);
    }

    @keyframes starsDrift{
      from{ transform:translateY(0); }
      to{ transform:translateY(92px); }
    }

    .title-wrap{
      position:absolute;
      inset:7vh 20px auto;
      z-index:20;
      text-align:center;
      pointer-events:none;
      opacity:0;
      transform:translateY(-18px);
      animation:titleIn 1.4s 3.6s cubic-bezier(.2,.8,.2,1) forwards;
    }

    h1{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      font-size:clamp(42px, 12vw, 92px);
      font-weight:500;
      line-height:.96;
      letter-spacing:.02em;
      text-transform:lowercase;
      color:#fff8fb;
      text-shadow:
        0 0 12px rgba(255,219,92,.45),
        0 0 34px rgba(255,69,69,.18);
    }

    .subtitle{
      margin-top:12px;
      font-size:clamp(12px, 3.2vw, 18px);
      letter-spacing:.32em;
      text-transform:uppercase;
      color:rgba(255,242,248,.72);
    }

    @keyframes titleIn{
      to{ opacity:1; transform:translateY(0); }
    }

    .garden{
      position:absolute;
      left:50%;
      bottom:4vh;
      width:min(900px, 100vw);
      height:min(68vh, 760px);
      transform:translateX(-50%);
      z-index:8;
    }

    .flower{
      position:absolute;
      left:var(--x);
      bottom:0;
      width:var(--w);
      height:var(--h);
      transform-origin:50% 100%;
      transform:translateX(-50%) rotate(var(--r)) scaleY(0);
      animation:
        grow 2.25s var(--d) cubic-bezier(.18,.84,.27,1) forwards,
        sway 5.5s calc(var(--d) + 2.25s) ease-in-out infinite alternate;
      filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));
    }

    @keyframes grow{
      0%{ transform:translateX(-50%) rotate(var(--r)) scaleY(0); }
      74%{ transform:translateX(-50%) rotate(var(--r)) scaleY(1.04); }
      100%{ transform:translateX(-50%) rotate(var(--r)) scaleY(1); }
    }

    @keyframes sway{
      from{ transform:translateX(-50%) rotate(calc(var(--r) - 1.8deg)) scaleY(1); }
      to{ transform:translateX(-50%) rotate(calc(var(--r) + 1.8deg)) scaleY(1); }
    }

    .flower svg{
      width:100%;
      height:100%;
      overflow:visible;
    }

    .leaf{
      transform-origin:center;
      animation:leafPulse 4.8s ease-in-out infinite alternate;
    }

    @keyframes leafPulse{
      from{ filter:brightness(.9); }
      to{ filter:brightness(1.15); }
    }

    .spark{
      position:absolute;
      left:var(--x);
      top:var(--y);
      width:4px;
      height:4px;
      border-radius:50%;
      z-index:4;
      background:#fff6b7;
      box-shadow:0 0 10px 2px rgba(255,241,155,.6);
      animation:twinkle var(--t) var(--d) ease-in-out infinite;
    }

    @keyframes twinkle{
      0%,100%{ opacity:.1; transform:scale(.45); }
      50%{ opacity:1; transform:scale(1.35); }
    }

    .ground-glow{
      position:absolute;
      left:50%;
      bottom:1.5vh;
      width:min(700px, 88vw);
      height:110px;
      transform:translateX(-50%);
      z-index:3;
      border-radius:50%;
      background:radial-gradient(ellipse at center, rgba(25,180,110,.24), transparent 68%);
      filter:blur(12px);
      animation:glowPulse 4s ease-in-out infinite alternate;
    }

    @keyframes glowPulse{
      from{ opacity:.45; transform:translateX(-50%) scale(.92); }
      to{ opacity:.85; transform:translateX(-50%) scale(1.06); }
    }

    .replay{
      position:absolute;
      right:16px;
      bottom:16px;
      z-index:30;
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      padding:10px 14px;
      color:rgba(255,255,255,.75);
      background:rgba(7,12,28,.45);
      backdrop-filter:blur(10px);
      font-size:13px;
      cursor:pointer;
      transition:.25s ease;
    }

    .replay:hover,
    .replay:active{
      color:#fff;
      border-color:rgba(255,210,90,.6);
      background:rgba(255,77,77,.18);
    }

    @media (max-width:600px){
      .title-wrap{ top:5.5vh; }
      .garden{
        bottom:2vh;
        height:67vh;
      }
      .subtitle{ letter-spacing:.2em; }
      .replay{
        bottom:10px;
        right:10px;
        font-size:12px;
        padding:8px 11px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-delay:0ms !important;
        animation-iteration-count:1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Jardín animado con tulipanes amarillos y rosas rojas">
    <div class="title-wrap">
      <h1>sonríe jath</h1>
    </div>

    <div class="ground-glow"></div>

    <section class="garden" aria-hidden="true">
      <!-- Tulipán izquierdo -->
      <div class="flower" style="--x:18%;--w:145px;--h:390px;--r:-7deg;--d:.25s;">
        <svg viewBox="0 0 160 430">
          <defs>
            <linearGradient id="stem1" x1="0" x2="1">
              <stop offset="0" stop-color="#087044"/>
              <stop offset=".55" stop-color="#1ab66a"/>
              <stop offset="1" stop-color="#075b39"/>
            </linearGradient>
            <linearGradient id="tulip1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff6b3"/>
              <stop offset=".58" stop-color="#ffd95a"/>
              <stop offset="1" stop-color="#f4b400"/>
            </linearGradient>
          </defs>
          <path d="M79 400 C74 312,76 220,83 120" fill="none" stroke="url(#stem1)" stroke-width="10" stroke-linecap="round"/>
          <path class="leaf" d="M78 302 C35 270,22 250,18 208 C54 220,76 247,80 289Z" fill="#0b8c50"/>
          <path class="leaf" d="M81 264 C114 225,135 210,145 174 C109 182,86 211,80 253Z" fill="#16a860"/>
          <g transform="translate(82 88)">
            <path d="M0 38 C-44 28,-54 -10,-32 -28 C-14 -42,-2 -18,0 -5 C6 -24,22 -43,37 -27 C58 -5,42 30,0 38Z" fill="url(#tulip1)"/>
            <path d="M0 38 C-19 20,-23 -9,0 -36 C22 -8,19 20,0 38Z" fill="#ffe27c" opacity=".88"/>
            <ellipse cx="0" cy="30" rx="27" ry="11" fill="#e0a000" opacity=".28"/>
          </g>
        </svg>
      </div>

      <!-- Rosa izquierda -->
      <div class="flower" style="--x:35%;--w:155px;--h:440px;--r:3deg;--d:.55s;">
        <svg viewBox="0 0 170 470">
          <defs>
            <linearGradient id="stem2" x1="0" x2="1">
              <stop offset="0" stop-color="#075c39"/>
              <stop offset=".5" stop-color="#18a761"/>
              <stop offset="1" stop-color="#06492f"/>
            </linearGradient>
            <radialGradient id="rose1" cx="48%" cy="40%">
              <stop offset="0" stop-color="#ffd8d8"/>
              <stop offset=".45" stop-color="#ff5a5a"/>
              <stop offset="1" stop-color="#c80d0d"/>
            </radialGradient>
          </defs>
          <path d="M86 447 C83 336,83 235,88 108" fill="none" stroke="url(#stem2)" stroke-width="10" stroke-linecap="round"/>
          <path class="leaf" d="M84 336 C43 310,26 286,25 251 C58 262,78 287,86 321Z" fill="#0c824b"/>
          <path class="leaf" d="M87 298 C122 267,139 243,146 210 C111 218,92 245,86 281Z" fill="#16a860"/>
          <g transform="translate(88 89)">
            <circle r="54" fill="url(#rose1)" opacity=".96"/>
            <path d="M-42 6 C-52 -27,-15 -54,7 -32 C28 -54,58 -20,39 6 C59 26,28 57,3 38 C-21 60,-54 30,-42 6Z" fill="#ef2f2f"/>
            <path d="M-28 2 C-34 -20,-8 -36,7 -22 C22 -37,42 -15,30 4 C42 20,18 39,2 28 C-13 41,-38 20,-28 2Z" fill="#ff8080"/>
            <path d="M-13 1 C-15 -12,1 -20,10 -10 C22 -2,12 15,1 17 C-10 14,-19 9,-13 1Z" fill="#b30000"/>
            <circle cx="3" cy="1" r="7" fill="#ffe6e6"/>
          </g>
        </svg>
      </div>

      <!-- Tulipán central -->
      <div class="flower" style="--x:50%;--w:180px;--h:520px;--r:-1deg;--d:.05s;">
        <svg viewBox="0 0 190 550">
          <defs>
            <linearGradient id="stem3" x1="0" x2="1">
              <stop offset="0" stop-color="#087044"/>
              <stop offset=".5" stop-color="#1bb96c"/>
              <stop offset="1" stop-color="#075637"/>
            </linearGradient>
            <linearGradient id="tulip3" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff9c8"/>
              <stop offset=".55" stop-color="#ffe16e"/>
              <stop offset="1" stop-color="#f4bc1c"/>
            </linearGradient>
          </defs>
          <path d="M95 530 C92 402,93 275,95 128" fill="none" stroke="url(#stem3)" stroke-width="11" stroke-linecap="round"/>
          <path class="leaf" d="M92 395 C47 367,25 335,24 287 C67 305,89 340,95 382Z" fill="#0d8d50"/>
          <path class="leaf" d="M97 347 C140 310,161 273,166 232 C126 246,103 287,94 330Z" fill="#17a960"/>
          <g transform="translate(96 102)">
            <path d="M0 42 C-52 32,-64 -14,-38 -34 C-18 -50,-3 -22,0 -7 C7 -28,27 -53,45 -33 C70 -7,50 34,0 42Z" fill="url(#tulip3)"/>
            <path d="M0 42 C-24 22,-29 -11,0 -43 C28 -10,23 22,0 42Z" fill="#ffe788" opacity=".9"/>
            <path d="M-36 -28 C-26 -12,-17 2,0 11 C-14 -6,-18 -26,-16 -41Z" fill="#fff2a8" opacity=".55"/>
          </g>
        </svg>
      </div>

      <!-- Rosa derecha -->
      <div class="flower" style="--x:66%;--w:160px;--h:445px;--r:-4deg;--d:.7s;">
        <svg viewBox="0 0 175 475">
          <defs>
            <linearGradient id="stem4" x1="0" x2="1">
              <stop offset="0" stop-color="#065b39"/>
              <stop offset=".52" stop-color="#1ab368"/>
              <stop offset="1" stop-color="#06492f"/>
            </linearGradient>
            <radialGradient id="rose2" cx="52%" cy="42%">
              <stop offset="0" stop-color="#ffe1e1"/>
              <stop offset=".48" stop-color="#ff5f5f"/>
              <stop offset="1" stop-color="#c30f0f"/>
            </radialGradient>
          </defs>
          <path d="M88 450 C88 350,88 230,85 110" fill="none" stroke="url(#stem4)" stroke-width="10" stroke-linecap="round"/>
          <path class="leaf" d="M87 330 C49 303,31 278,31 240 C66 251,83 278,89 316Z" fill="#0c824b"/>
          <path class="leaf" d="M87 287 C121 260,142 235,150 201 C115 208,93 238,87 270Z" fill="#18a760"/>
          <g transform="translate(85 91)">
            <circle r="53" fill="url(#rose2)"/>
            <path d="M-41 6 C-52 -25,-18 -53,6 -33 C26 -52,56 -24,41 4 C61 23,31 55,5 39 C-18 58,-54 32,-41 6Z" fill="#ef2a2a"/>
            <path d="M-29 1 C-34 -19,-10 -37,6 -23 C22 -38,43 -15,30 3 C43 19,20 40,3 28 C-13 41,-38 21,-29 1Z" fill="#ff8686"/>
            <path d="M-14 0 C-17 -12,-1 -22,10 -11 C21 -2,13 15,1 17 C-11 13,-19 8,-14 0Z" fill="#b10000"/>
            <circle cx="2" cy="1" r="7" fill="#ffe8e8"/>
          </g>
        </svg>
      </div>

      <!-- Tulipán derecho -->
      <div class="flower" style="--x:82%;--w:135px;--h:375px;--r:8deg;--d:.4s;">
        <svg viewBox="0 0 150 420">
          <defs>
            <linearGradient id="stem5" x1="0" x2="1">
              <stop offset="0" stop-color="#075b39"/>
              <stop offset=".55" stop-color="#1ab66a"/>
              <stop offset="1" stop-color="#06472e"/>
            </linearGradient>
            <linearGradient id="tulip5" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff4b3"/>
              <stop offset=".55" stop-color="#ffd957"/>
              <stop offset="1" stop-color="#edae00"/>
            </linearGradient>
          </defs>
          <path d="M75 397 C74 314,78 216,72 119" fill="none" stroke="url(#stem5)" stroke-width="9" stroke-linecap="round"/>
          <path class="leaf" d="M75 302 C38 278,24 252,23 217 C56 229,72 254,77 290Z" fill="#0b874e"/>
          <path class="leaf" d="M74 268 C108 239,125 211,132 181 C101 188,79 217,74 251Z" fill="#16a860"/>
          <g transform="translate(72 91)">
            <path d="M0 38 C-43 29,-54 -9,-32 -28 C-14 -42,-2 -18,0 -5 C6 -24,22 -43,37 -27 C58 -5,42 30,0 38Z" fill="url(#tulip5)"/>
            <path d="M0 38 C-19 20,-23 -9,0 -36 C22 -8,19 20,0 38Z" fill="#ffe786" opacity=".9"/>
          </g>
        </svg>
      </div>
    </section>

    <button class="replay" type="button" onclick="restartAnimation()">↻ Repetir</button>
  </main>

  <script>
    const scene = document.getElementById('scene');

    function addSparks(){
      const total = window.innerWidth < 600 ? 28 : 44;
      for(let i=0;i<total;i++){
        const spark = document.createElement('span');
        spark.className = 'spark';
        spark.style.setProperty('--x', `${4 + Math.random()*92}%`);
        spark.style.setProperty('--y', `${8 + Math.random()*78}%`);
        spark.style.setProperty('--t', `${1.4 + Math.random()*3.6}s`);
        spark.style.setProperty('--d', `${Math.random()*4}s`);
        spark.style.transform = `scale(${.5 + Math.random()})`;
        scene.appendChild(spark);
      }
    }

    function restartAnimation(){
      const flowers = [...document.querySelectorAll('.flower')];
      const title = document.querySelector('.title-wrap');

      flowers.forEach(el => {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });

      title.style.animation = 'none';
      void title.offsetWidth;
      title.style.animation = '';
    }

    addSparks();
  </script>
</body>
</html>
