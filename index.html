<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#040814" />
  <title>Sonríe Jath</title>
  <style>
    :root{
      --sky-1:#040814;
      --sky-2:#07142c;
      --sky-3:#09203e;
      --gold-1:#fff6b2;
      --gold-2:#ffd85a;
      --gold-3:#e8a900;
      --red-1:#ffd6d6;
      --red-2:#ff5656;
      --red-3:#b60d0d;
      --leaf-1:#13a060;
      --leaf-2:#0a7a48;
      --leaf-3:#43bf81;
      --mist:#4ae1bb;
      --text:#fff9f0;
    }

    *{ box-sizing:border-box; }

    html, body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#020510;
      font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body{
      color:var(--text);
      -webkit-tap-highlight-color:transparent;
      user-select:none;
      overscroll-behavior:none;
    }

    .scene{
      position:relative;
      width:100%;
      height:100%;
      overflow:hidden;
      isolation:isolate;
      background:
        radial-gradient(circle at 50% 78%, rgba(55,160,197,.16), transparent 23%),
        radial-gradient(circle at 15% 15%, rgba(117,52,153,.12), transparent 25%),
        linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 50%, var(--sky-3) 78%, #000 100%);
    }

    .sky-stars{
      position:absolute;
      inset:0;
      z-index:0;
      pointer-events:none;
      opacity:.85;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 2px),
        radial-gradient(circle, rgba(255,228,114,.95) 0 1.2px, transparent 2.3px),
        radial-gradient(circle, rgba(255,255,255,.65) 0 .8px, transparent 1.5px);
      background-size: 110px 110px, 170px 170px, 72px 72px;
      background-position: 15px 21px, 60px 40px, 30px 10px;
      animation: skyShift 30s linear infinite;
    }

    @keyframes skyShift{
      from{ transform:translateY(0); }
      to{ transform:translateY(110px); }
    }

    .moon{
      position:absolute;
      top:7vh;
      right:8vw;
      width:min(18vw, 92px);
      aspect-ratio:1;
      z-index:1;
      border-radius:50%;
      background:
        radial-gradient(circle at 32% 30%, #fffef8 0 22%, #fff7d9 23% 48%, #f7dfa0 49% 72%, rgba(247,223,160,.2) 73% 100%);
      box-shadow:
        0 0 18px rgba(255,236,171,.45),
        0 0 42px rgba(255,236,171,.28),
        0 0 78px rgba(255,236,171,.18);
      opacity:.85;
      filter:saturate(1.08);
    }

    .moon::before,
    .moon::after{
      content:"";
      position:absolute;
      border-radius:50%;
      background:rgba(219,203,150,.16);
      filter:blur(.2px);
    }

    .moon::before{ width:18%; height:18%; top:22%; left:30%; }
    .moon::after{ width:12%; height:12%; bottom:26%; right:24%; }

    .moon-glow{
      position:absolute;
      top:5vh;
      right:5vw;
      width:min(28vw, 140px);
      aspect-ratio:1;
      z-index:0;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,228,130,.25), rgba(255,228,130,0) 68%);
      filter:blur(10px);
      animation: moonPulse 6s ease-in-out infinite alternate;
    }

    @keyframes moonPulse{
      from{ opacity:.28; transform:scale(.94); }
      to{ opacity:.52; transform:scale(1.08); }
    }

    .title-wrap{
      position:absolute;
      top:6.5vh;
      left:50%;
      transform:translateX(-50%);
      width:min(92vw, 860px);
      z-index:10;
      text-align:center;
      pointer-events:none;
      opacity:0;
      animation: titleEnter 1.3s .8s cubic-bezier(.2,.8,.2,1) forwards;
    }

    h1{
      margin:0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight:500;
      font-size:clamp(42px, 10.6vw, 96px);
      line-height:1;
      letter-spacing:.015em;
      text-transform:lowercase;
      color:var(--text);
      text-shadow:
        0 0 10px rgba(255,246,221,.82),
        0 0 24px rgba(255,227,137,.35),
        0 0 54px rgba(255,227,137,.16);
      animation: titleGlow 3.8s ease-in-out infinite alternate;
    }

    .subtitle{
      margin-top:10px;
      font-size:clamp(11px, 2.9vw, 18px);
      letter-spacing:.28em;
      text-transform:uppercase;
      color:rgba(255,246,238,.72);
    }

    @keyframes titleEnter{
      from{ opacity:0; transform:translateX(-50%) translateY(-14px); }
      to{ opacity:1; transform:translateX(-50%) translateY(0); }
    }

    @keyframes titleGlow{
      from{
        text-shadow:
          0 0 9px rgba(255,246,221,.7),
          0 0 22px rgba(255,227,137,.24),
          0 0 44px rgba(255,227,137,.12);
      }
      to{
        text-shadow:
          0 0 12px rgba(255,246,221,.92),
          0 0 30px rgba(255,227,137,.4),
          0 0 62px rgba(255,227,137,.2);
      }
    }

    .garden{
      position:absolute;
      left:50%;
      bottom:2.3vh;
      width:min(980px, 100vw);
      height:min(67vh, 760px);
      transform:translateX(-50%);
      z-index:6;
    }

    .mist{
      position:absolute;
      left:50%;
      bottom:3vh;
      width:min(94vw, 880px);
      height:120px;
      transform:translateX(-50%);
      z-index:2;
      border-radius:50%;
      background:
        radial-gradient(ellipse at 30% 50%, rgba(74,225,187,.18), transparent 60%),
        radial-gradient(ellipse at 68% 50%, rgba(74,225,187,.16), transparent 60%),
        radial-gradient(ellipse at center, rgba(74,225,187,.18), transparent 68%);
      filter:blur(18px);
      animation: mistMove 5s ease-in-out infinite alternate;
    }

    @keyframes mistMove{
      from{ opacity:.45; transform:translateX(-50%) scale(.96); }
      to{ opacity:.82; transform:translateX(-50%) scale(1.04); }
    }

    .grass{
      position:absolute;
      bottom:0;
      left:var(--x);
      width:var(--w);
      height:var(--h);
      border-radius:100% 0 100% 0;
      background:linear-gradient(180deg, #1ec978, #0b6f44 80%);
      transform-origin:bottom center;
      transform:translateX(-50%) rotate(var(--r));
      opacity:.88;
      filter:drop-shadow(0 0 8px rgba(20,156,96,.18));
    }

    .flower{
      position:absolute;
      left:var(--x);
      bottom:0;
      width:var(--w);
      height:var(--h);
      transform-origin:50% 100%;
      transform:translateX(-50%) rotate(var(--r)) scaleY(0);
      animation:
        flowerGrow 1.9s var(--d) cubic-bezier(.18,.84,.27,1) forwards,
        flowerSway 5s calc(var(--d) + 1.9s) ease-in-out infinite alternate;
      filter:drop-shadow(0 14px 20px rgba(0,0,0,.34));
      will-change:transform;
    }

    .flower svg{
      width:100%;
      height:100%;
      overflow:visible;
    }

    @keyframes flowerGrow{
      0%{ transform:translateX(-50%) rotate(var(--r)) scaleY(0); }
      72%{ transform:translateX(-50%) rotate(var(--r)) scaleY(1.05); }
      100%{ transform:translateX(-50%) rotate(var(--r)) scaleY(1); }
    }

    @keyframes flowerSway{
      from{ transform:translateX(-50%) rotate(calc(var(--r) - 1.4deg)) scaleY(1); }
      to{ transform:translateX(-50%) rotate(calc(var(--r) + 1.5deg)) scaleY(1); }
    }

    .leaf{
      animation: leafWave 4.5s ease-in-out infinite alternate;
      transform-origin:center;
    }

    @keyframes leafWave{
      from{ filter:brightness(.96); }
      to{ filter:brightness(1.16); }
    }

    .firefly{
      position:absolute;
      left:var(--x);
      top:var(--y);
      width:var(--s);
      height:var(--s);
      z-index:3;
      border-radius:50%;
      pointer-events:none;
      background:radial-gradient(circle, rgba(255,247,186,1) 0 34%, rgba(255,214,74,.96) 35% 64%, rgba(255,214,74,0) 100%);
      box-shadow:
        0 0 10px rgba(255,228,112,.95),
        0 0 24px rgba(255,208,74,.7),
        0 0 48px rgba(255,208,74,.34);
      opacity:.18;
      animation:
        fireflyBlink var(--t) var(--d) ease-in-out infinite,
        fireflyFloat var(--tf) var(--df) ease-in-out infinite alternate;
      will-change:transform,opacity;
      filter:blur(.12px);
    }

    .firefly.big{
      width:var(--s2);
      height:var(--s2);
      box-shadow:
        0 0 16px rgba(255,228,112,.96),
        0 0 34px rgba(255,208,74,.8),
        0 0 70px rgba(255,208,74,.38);
      animation-duration: calc(var(--t) * 1.2), calc(var(--tf) * 1.2);
    }

    @keyframes fireflyBlink{
      0%,100%{ opacity:.06; transform:scale(.5); }
      22%{ opacity:.34; transform:scale(.86); }
      48%{ opacity:1; transform:scale(1.72); }
      70%{ opacity:.56; transform:scale(1.02); }
    }

    @keyframes fireflyFloat{
      from{ margin-left:-4px; margin-top:2px; }
      to{ margin-left:6px; margin-top:-14px; }
    }

    .tap-burst{
      position:absolute;
      width:14px;
      height:14px;
      margin-left:-7px;
      margin-top:-7px;
      border-radius:50%;
      pointer-events:none;
      z-index:20;
      background:radial-gradient(circle, rgba(255,245,190,.95), rgba(255,210,80,.2) 55%, rgba(255,210,80,0) 72%);
      box-shadow:
        0 0 14px rgba(255,233,122,.8),
        0 0 34px rgba(255,205,80,.45);
      animation: burstPop .8s ease-out forwards;
    }

    @keyframes burstPop{
      0%{ opacity:0; transform:scale(.2); }
      15%{ opacity:1; }
      100%{ opacity:0; transform:scale(3.2); }
    }

    .replay{
      position:absolute;
      right:12px;
      bottom:12px;
      z-index:25;
      border:none;
      border-radius:999px;
      padding:10px 14px;
      color:rgba(255,255,255,.86);
      background:rgba(9,14,30,.58);
      box-shadow:0 6px 20px rgba(0,0,0,.24);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      font-size:13px;
      cursor:pointer;
      transition:.25s ease;
    }

    .replay:hover,
    .replay:active{
      background:rgba(255,204,86,.14);
      color:#fff;
      transform:translateY(-1px);
    }

    .hint{
      position:absolute;
      left:50%;
      bottom:14px;
      transform:translateX(-50%);
      z-index:15;
      font-size:11px;
      letter-spacing:.08em;
      color:rgba(255,255,255,.45);
      pointer-events:none;
      opacity:.8;
    }

    @media (max-width: 600px){
      .moon{ top:7vh; right:7vw; width:min(20vw, 84px); }
      .moon-glow{ top:5vh; right:4vw; width:min(30vw, 126px); }
      .title-wrap{ top:5.6vh; }
      h1{ font-size:clamp(40px, 10.2vw, 68px); }
      .subtitle{ letter-spacing:.18em; }
      .garden{ height:64vh; bottom:2vh; }
      .mist{ height:104px; bottom:4vh; }
      .replay{ padding:9px 12px; font-size:12px; }
      .hint{ display:none; }
    }

    @media (min-width: 900px){
      .hint{ font-size:12px; }
    }

    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{
        animation-duration:.01ms !important;
        animation-delay:0ms !important;
        animation-iteration-count:1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="Jardín nocturno animado con tulipanes amarillos y rosas rojas">
    <div class="sky-stars"></div>
    <div class="moon-glow"></div>
    <div class="moon"></div>

    <div class="title-wrap">
      <h1>sonríe jath</h1>
    </div>

    <div class="mist"></div>

    <section class="garden" aria-hidden="true" id="garden">
      <!-- Grass backdrop -->
      <span class="grass" style="--x:8%; --w:16px; --h:130px; --r:-16deg;"></span>
      <span class="grass" style="--x:15%; --w:12px; --h:82px; --r:12deg;"></span>
      <span class="grass" style="--x:23%; --w:18px; --h:110px; --r:-10deg;"></span>
      <span class="grass" style="--x:31%; --w:12px; --h:84px; --r:8deg;"></span>
      <span class="grass" style="--x:42%; --w:16px; --h:124px; --r:-12deg;"></span>
      <span class="grass" style="--x:58%; --w:15px; --h:102px; --r:10deg;"></span>
      <span class="grass" style="--x:68%; --w:16px; --h:132px; --r:-8deg;"></span>
      <span class="grass" style="--x:77%; --w:13px; --h:90px; --r:12deg;"></span>
      <span class="grass" style="--x:88%; --w:18px; --h:122px; --r:-10deg;"></span>

      <!-- Tulipán izquierdo -->
      <div class="flower" style="--x:12%; --w:140px; --h:355px; --r:-8deg; --d:.18s;">
        <svg viewBox="0 0 150 390">
          <defs>
            <linearGradient id="stemA" x1="0" x2="1">
              <stop offset="0" stop-color="#0a7d49"/>
              <stop offset=".5" stop-color="#1bc36f"/>
              <stop offset="1" stop-color="#095d38"/>
            </linearGradient>
            <linearGradient id="tulipA" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff7c7"/>
              <stop offset=".56" stop-color="#ffd857"/>
              <stop offset="1" stop-color="#eda300"/>
            </linearGradient>
          </defs>
          <path d="M74 370 C70 302,72 214,76 110" fill="none" stroke="url(#stemA)" stroke-width="10" stroke-linecap="round"/>
          <path class="leaf" d="M73 277 C40 247,26 224,22 186 C52 198,70 225,76 263Z" fill="#0f8f55"/>
          <path class="leaf" d="M75 244 C109 210,124 188,130 155 C102 163,82 194,75 229Z" fill="#43bf81"/>
          <g transform="translate(76 84)">
            <path d="M0 40 C-44 30,-56 -10,-34 -30 C-17 -44,-4 -18,0 -6 C6 -22,22 -45,39 -30 C62 -9,46 31,0 40Z" fill="url(#tulipA)"/>
            <path d="M0 40 C-20 21,-24 -10,0 -38 C23 -8,20 20,0 40Z" fill="#ffe787" opacity=".9"/>
          </g>
        </svg>
      </div>

      <!-- Rosa izquierda -->
      <div class="flower" style="--x:33%; --w:155px; --h:420px; --r:3deg; --d:.5s;">
        <svg viewBox="0 0 168 450">
          <defs>
            <linearGradient id="stemB" x1="0" x2="1">
              <stop offset="0" stop-color="#0a7243"/>
              <stop offset=".5" stop-color="#17b568"/>
              <stop offset="1" stop-color="#075935"/>
            </linearGradient>
            <radialGradient id="roseB" cx="50%" cy="38%">
              <stop offset="0" stop-color="#ffd8d8"/>
              <stop offset=".42" stop-color="#ff5a5a"/>
              <stop offset="1" stop-color="#bb0e0e"/>
            </radialGradient>
          </defs>
          <path d="M85 432 C83 338,84 232,86 105" fill="none" stroke="url(#stemB)" stroke-width="10" stroke-linecap="round"/>
          <path class="leaf" d="M84 316 C48 291,31 268,29 236 C61 246,79 271,86 302Z" fill="#0d8a50"/>
          <path class="leaf" d="M86 280 C118 251,136 227,143 195 C112 203,93 232,85 264Z" fill="#48c283"/>
          <g transform="translate(85 87)">
            <circle r="52" fill="url(#roseB)"/>
            <path d="M-40 6 C-52 -22,-18 -51,6 -33 C28 -52,58 -21,42 4 C61 24,30 55,5 38 C-18 58,-53 30,-40 6Z" fill="#f33232"/>
            <path d="M-28 0 C-33 -18,-9 -34,6 -23 C21 -35,40 -13,29 4 C40 19,19 39,2 27 C-12 39,-37 20,-28 0Z" fill="#ff9090"/>
            <path d="M-13 1 C-16 -12,0 -20,10 -10 C20 -2,13 14,1 16 C-10 13,-18 8,-13 1Z" fill="#b80000"/>
            <circle cx="2" cy="1" r="7" fill="#ffecec"/>
          </g>
        </svg>
      </div>

      <!-- Tulipán central -->
      <div class="flower" style="--x:50%; --w:180px; --h:500px; --r:-1deg; --d:.06s;">
        <svg viewBox="0 0 190 535">
          <defs>
            <linearGradient id="stemC" x1="0" x2="1">
              <stop offset="0" stop-color="#0b7d48"/>
              <stop offset=".52" stop-color="#1ac06c"/>
              <stop offset="1" stop-color="#0a6039"/>
            </linearGradient>
            <linearGradient id="tulipC" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff7c6"/>
              <stop offset=".57" stop-color="#ffe16d"/>
              <stop offset="1" stop-color="#e7a900"/>
            </linearGradient>
          </defs>
          <path d="M95 515 C92 396,93 276,95 126" fill="none" stroke="url(#stemC)" stroke-width="11" stroke-linecap="round"/>
          <path class="leaf" d="M93 376 C48 348,27 318,24 274 C66 291,88 324,95 362Z" fill="#109257"/>
          <path class="leaf" d="M97 332 C141 294,160 260,165 220 C125 233,102 274,95 315Z" fill="#4ac383"/>
          <g transform="translate(96 98)">
            <path d="M0 44 C-51 35,-64 -14,-38 -35 C-18 -51,-3 -23,0 -7 C7 -28,27 -53,45 -34 C70 -9,51 35,0 44Z" fill="url(#tulipC)"/>
            <path d="M0 44 C-24 24,-29 -11,0 -43 C29 -9,23 23,0 44Z" fill="#ffe98f" opacity=".92"/>
            <path d="M-28 -24 C-21 -10,-14 2,0 11 C-10 -2,-13 -20,-12 -34Z" fill="#fff2a8" opacity=".5"/>
          </g>
        </svg>
      </div>

      <!-- Rosa derecha -->
      <div class="flower" style="--x:67%; --w:160px; --h:430px; --r:-4deg; --d:.74s;">
        <svg viewBox="0 0 172 460">
          <defs>
            <linearGradient id="stemD" x1="0" x2="1">
              <stop offset="0" stop-color="#0a6f42"/>
              <stop offset=".5" stop-color="#17b166"/>
              <stop offset="1" stop-color="#085833"/>
            </linearGradient>
            <radialGradient id="roseD" cx="52%" cy="38%">
              <stop offset="0" stop-color="#ffe0e0"/>
              <stop offset=".42" stop-color="#ff5a5a"/>
              <stop offset="1" stop-color="#c20d0d"/>
            </radialGradient>
          </defs>
          <path d="M87 442 C86 339,87 233,84 108" fill="none" stroke="url(#stemD)" stroke-width="10" stroke-linecap="round"/>
          <path class="leaf" d="M85 321 C50 293,33 269,31 236 C63 247,80 272,87 307Z" fill="#0f8950"/>
          <path class="leaf" d="M86 282 C119 253,138 229,145 196 C113 204,93 232,86 267Z" fill="#45bd7e"/>
          <g transform="translate(85 88)">
            <circle r="52" fill="url(#roseD)"/>
            <path d="M-41 6 C-52 -23,-18 -52,6 -33 C28 -52,58 -22,42 4 C61 24,30 56,5 39 C-18 58,-53 31,-41 6Z" fill="#f12d2d"/>
            <path d="M-28 0 C-33 -18,-9 -35,6 -23 C20 -36,41 -14,29 4 C41 18,18 39,2 28 C-12 39,-38 20,-28 0Z" fill="#ff8c8c"/>
            <path d="M-13 1 C-16 -12,0 -21,10 -10 C20 -2,13 14,1 16 C-10 13,-18 8,-13 1Z" fill="#b30000"/>
            <circle cx="2" cy="1" r="7" fill="#fff0f0"/>
          </g>
        </svg>
      </div>

      <!-- Tulipán derecho -->
      <div class="flower" style="--x:86%; --w:136px; --h:340px; --r:9deg; --d:.32s;">
        <svg viewBox="0 0 148 372">
          <defs>
            <linearGradient id="stemE" x1="0" x2="1">
              <stop offset="0" stop-color="#0a7645"/>
              <stop offset=".55" stop-color="#19ba6a"/>
              <stop offset="1" stop-color="#085734"/>
            </linearGradient>
            <linearGradient id="tulipE" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff4b6"/>
              <stop offset=".56" stop-color="#ffd757"/>
              <stop offset="1" stop-color="#e2a000"/>
            </linearGradient>
          </defs>
          <path d="M73 354 C71 286,76 204,70 111" fill="none" stroke="url(#stemE)" stroke-width="9" stroke-linecap="round"/>
          <path class="leaf" d="M72 271 C39 245,24 222,23 189 C53 200,69 225,74 259Z" fill="#0f8850"/>
          <path class="leaf" d="M72 237 C104 208,120 184,126 154 C97 161,77 190,71 221Z" fill="#47bf80"/>
          <g transform="translate(70 84)">
            <path d="M0 39 C-42 30,-54 -9,-32 -28 C-15 -41,-3 -18,0 -6 C6 -22,21 -42,37 -27 C59 -6,43 31,0 39Z" fill="url(#tulipE)"/>
            <path d="M0 39 C-19 20,-23 -9,0 -36 C22 -8,20 20,0 39Z" fill="#ffe786" opacity=".92"/>
          </g>
        </svg>
      </div>
    </section>

    <button class="replay" type="button" onclick="restartScene()">↻ Repetir</button>
    <div class="hint">Toca la pantalla para encender más destellos</div>
  </main>

  <script>
    const scene = document.getElementById('scene');

    function addFireflies(){
      const isMobile = window.innerWidth < 700;
      const total = isMobile ? 42 : 58;
      const bigTotal = isMobile ? 14 : 18;

      for(let i=0;i<total;i++){
        const spark = document.createElement('span');
        spark.className = 'firefly';
        spark.style.setProperty('--x', `${4 + Math.random()*92}%`);
        spark.style.setProperty('--y', `${7 + Math.random()*75}%`);
        spark.style.setProperty('--s', `${3 + Math.random()*4.5}px`);
        spark.style.setProperty('--t', `${1.6 + Math.random()*2.6}s`);
        spark.style.setProperty('--d', `${Math.random()*3.5}s`);
        spark.style.setProperty('--tf', `${3 + Math.random()*3.2}s`);
        spark.style.setProperty('--df', `${Math.random()*2.4}s`);
        scene.appendChild(spark);
      }

      for(let i=0;i<bigTotal;i++){
        const glow = document.createElement('span');
        glow.className = 'firefly big';
        glow.style.setProperty('--x', `${6 + Math.random()*88}%`);
        glow.style.setProperty('--y', `${9 + Math.random()*72}%`);
        glow.style.setProperty('--s', `${4 + Math.random()*4}px`);
        glow.style.setProperty('--s2', `${12 + Math.random()*18}px`);
        glow.style.setProperty('--t', `${2.4 + Math.random()*3.2}s`);
        glow.style.setProperty('--d', `${Math.random()*4}s`);
        glow.style.setProperty('--tf', `${4 + Math.random()*3}s`);
        glow.style.setProperty('--df', `${Math.random()*2.8}s`);
        scene.appendChild(glow);
      }
    }

    function addBurst(x, y, count = 8){
      for(let i=0; i<count; i++){
        const dot = document.createElement('span');
        dot.className = 'tap-burst';
        dot.style.left = `${x + (Math.random()*60 - 30)}px`;
        dot.style.top = `${y + (Math.random()*50 - 25)}px`;
        dot.style.animationDelay = `${Math.random()*0.12}s`;
        scene.appendChild(dot);
        setTimeout(() => dot.remove(), 900);
      }
    }

    function restartScene(){
      const flowers = document.querySelectorAll('.flower');
      const title = document.querySelector('.title-wrap');
      flowers.forEach(el => {
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = '';
      });
      title.style.animation = 'none';
      void title.offsetWidth;
      title.style.animation = '';
      addBurst(window.innerWidth * 0.5, window.innerHeight * 0.35, 12);
    }

    function pointerBurst(event){
      const x = event.touches ? event.touches[0].clientX : event.clientX;
      const y = event.touches ? event.touches[0].clientY : event.clientY;
      addBurst(x, y, 10);
    }

    scene.addEventListener('click', pointerBurst, { passive:true });
    scene.addEventListener('touchstart', pointerBurst, { passive:true });

    addFireflies();

    setTimeout(() => {
      addBurst(window.innerWidth * 0.5, window.innerHeight * 0.28, 8);
    }, 1800);
  </script>
</body>
</html>
